    <style>

        * {
            box-sizing: border-box;
        }


        /* General page */

        body {
            margin: 0;
            background-color: #1A1A1A;
        }


        /* Navigation */

        nav {
            position: sticky;
            top: 0;
            z-index: 1000;
            width: 100%;
            padding: 15px 20px;
            background-color: #1A1A1A;
            display: flex;
            align-items: center;
        }

            nav a {
                font-family: "Stint Ultra Condensed", serif;
                font-weight: bold;
                color: #ffff;
                text-decoration: none;
            }

        @media (max-width: 600px) {
            nav {
                overflow-x: auto;
                white-space: nowrap;
            }
        }

        .home-link {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #ffff;
            text-decoration: none;
        }


            .home-link span {
                font-family: "Stint Ultra Condensed", serif;
                font-size: 1.5rem;
            }

        .nav-center {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 100px;
        }

            .nav-center a {
                font-family: "Stint Ultra Condensed", serif;
                font-weight: bold;
                font-size: clamp(1.2rem, 1.7vw, 1.4rem);
                color: #ffff;
                text-decoration: none;
            }

        .nav img {
            height: 10%;
            width: 10%;
        }

        .nav-center a:hover {
            text-decoration: underline;
        }

        /* Hero title */

        /* h1 {

        .hero {

            padding-right: clamp(20px, 5vw, 100px);*/

            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: left;
            overflow: hidden;
        }

            .hero img {

            .hero p {

                font-size: clamp(1rem, 2vw, 1.3rem);

                color: #1A1A1A;

        @media (max-width: 600px) {
